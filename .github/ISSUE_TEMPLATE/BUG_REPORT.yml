name: Bug Report
description: Report a bug
title: "[BUG] "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect?
    validations:
      required: true

  - type: input
    id: vscode
    attributes:
      label: VSCode Version

  - type: input
    id: extension
    attributes:
      label: Extension Version

  - type: input
    id: os
    attributes:
      label: Operating System

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste logs if available.
      render: shell
